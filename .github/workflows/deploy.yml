name: Deploy

# Publicação reproduzível: roda o CI, publica a imagem Docker no GHCR e implanta no ambiente
# da branch (main = homologação, prod = produção). A implantação não depende de uma plataforma
# específica: o método é escolhido pela variável DEPLOY_METHOD do GitHub Environment
# (webhook ou ssh). Sem ela, o workflow apenas publica a imagem. Detalhes em docs/CICD.md.
on:
  push:
    branches: [main, prod]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente de destino
        type: choice
        options:
          - homologacao
          - producao
        default: homologacao

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar imagem
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ambiente: ${{ steps.ambiente.outputs.nome }}
    steps:
      - name: Definir o ambiente de destino
        id: ambiente
        env:
          ENTRADA: ${{ inputs.ambiente }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$ENTRADA" ]; then
            nome="$ENTRADA"
          elif [ "$BRANCH" = "prod" ]; then
            nome="producao"
          else
            nome="homologacao"
          fi
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "Ambiente de destino: $nome"

      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.ambiente.outputs.nome }}
            type=raw,value=latest,enable=${{ steps.ambiente.outputs.nome == 'producao' }}
            type=sha,prefix=sha-

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  implantar:
    name: Implantar
    needs: publicar
    runs-on: ubuntu-latest
    environment: ${{ needs.publicar.outputs.ambiente }}
    concurrency:
      group: deploy-${{ needs.publicar.outputs.ambiente }}
      cancel-in-progress: false
    steps:
      - name: Implantar por webhook
        if: vars.DEPLOY_METHOD == 'webhook'
        env:
          URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          METODO: ${{ vars.DEPLOY_WEBHOOK_METHOD || 'POST' }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Defina o secret DEPLOY_WEBHOOK_URL no ambiente."
            exit 1
          fi
          # Remove espaços e quebras de linha que costumam vir de um copiar e colar
          METODO="$(printf '%s' "$METODO" | tr -d '[:space:]')"
          URL="$(printf '%s' "$URL" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$TOKEN" | tr -d '[:space:]')"

          cabecalho=()
          if [ -n "$TOKEN" ]; then
            cabecalho=(-H "Authorization: Bearer $TOKEN")
          fi

          status="$(curl --silent --show-error --max-time 60 -X "$METODO" \
            "${cabecalho[@]}" -D cabecalhos.txt -o resposta.txt \
            -w '%{http_code}' "$URL")"
          echo "Método: $METODO | Status HTTP: $status"

          if [ "$status" -ge 400 ]; then
            echo "::error::O webhook respondeu $status."
            echo "Métodos aceitos (cabeçalho Allow): $(grep -i '^allow:' cabecalhos.txt || echo 'não informado')"
            echo "Resposta:"
            head -c 500 resposta.txt
            echo
            exit 1
          fi
          echo "Webhook de deploy acionado."

      - name: Implantar por SSH
        if: vars.DEPLOY_METHOD == 'ssh'
        env:
          HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          USUARIO: ${{ secrets.DEPLOY_SSH_USER }}
          PORTA: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          CHAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          DIRETORIO: ${{ vars.DEPLOY_SSH_PATH }}
          COMANDO: ${{ vars.DEPLOY_SSH_COMMAND || 'docker compose pull && docker compose up -d' }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USUARIO" ] || [ -z "$CHAVE" ] || [ -z "$DIRETORIO" ]; then
            echo "::error::Defina DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY e a variável DEPLOY_SSH_PATH."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORTA" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "$PORTA" "$USUARIO@$HOST" \
            "cd '$DIRETORIO' && $COMANDO"
          echo "Deploy por SSH concluído."

      - name: Nenhum método de implantação configurado
        if: vars.DEPLOY_METHOD != 'webhook' && vars.DEPLOY_METHOD != 'ssh'
        run: >-
          echo "::warning::DEPLOY_METHOD não está definido neste ambiente:
          a imagem foi publicada no GHCR, mas nada foi implantado."

  verificar:
    name: Verificar
    needs: [publicar, implantar]
    runs-on: ubuntu-latest
    environment: ${{ needs.publicar.outputs.ambiente }}
    steps:
      - name: Aguardar a API responder em /ready
        env:
          BASE_URL: ${{ vars.API_BASE_URL }}
          ESPERA: ${{ vars.DEPLOY_VERIFY_DELAY || '30' }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::warning::API_BASE_URL não está definida neste ambiente: verificação ignorada."
            exit 0
          fi
          echo "Aguardando $ESPERA s para a plataforma trocar a versão."
          sleep "$ESPERA"
          url="${BASE_URL%/}/ready"
          for tentativa in $(seq 1 10); do
            if curl --fail --silent --show-error --max-time 15 "$url"; then
              echo
              echo "API pronta em $url (tentativa $tentativa)."
              exit 0
            fi
            echo "Tentativa $tentativa de 10 falhou; nova tentativa em 15 s."
            sleep 15
          done
          echo "::error::A API não respondeu em $url após o deploy."
          exit 1
