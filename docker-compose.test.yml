# PostgreSQL descartável para os testes de integração.
# Uso: docker compose -f docker-compose.test.yml up -d
# Não é preciso instalar o PostgreSQL na máquina: ele roda neste contêiner.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: verdear-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: verdear_test
    ports:
      # Porta 5433 no host para não conflitar com um PostgreSQL local na 5432
      - "5433:5432"
    # Dados em memória: somem ao derrubar o contêiner
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verdear_test"]
      interval: 5s
      timeout: 5s
      retries: 10
