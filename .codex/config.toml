# Configuração de MCP para ChatGPT desktop app / Codex CLI / Codex IDE extension.
# Servidores remotos oficiais (GitHub, Atlassian, Notion) via OAuth — sem tokens no repositório.
# Na primeira vez, autentique cada servidor com: codex mcp login <nome>
# Observação: config de projeto só é carregada em projetos marcados como "trusted".

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v2/mcp"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
